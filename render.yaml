services:
  - type: web
    name: psrc-tms-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_HOST
        fromDatabase:
          name: psrc-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: psrc-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: psrc-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: psrc-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: psrc-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://psrc-tms-frontend.onrender.com

  - type: web
    name: psrc-tms-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://psrc-tms-backend.onrender.com

databases:
  - name: psrc-db
    plan: starter
    databaseName: psrc_tms
    user: psrc_user
