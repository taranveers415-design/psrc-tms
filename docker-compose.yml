version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: psrc-postgres
    environment:
      POSTGRES_DB: psrc_tms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: psrc_password_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    networks:
      - psrc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: psrc-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: psrc_tms
      DB_USER: postgres
      DB_PASSWORD: psrc_password_2024
      DB_SSL: false
      JWT_SECRET: psrc-tms-production-secret-key-2024
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - psrc-network
    restart: unless-stopped

  # Frontend (served via nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: psrc-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - psrc-network
    restart: unless-stopped

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: psrc-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend
    networks:
      - psrc-network
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:

networks:
  psrc-network:
    driver: bridge
